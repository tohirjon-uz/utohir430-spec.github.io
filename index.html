
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tohirjon Usmonov | Shaxsiy sahifa</title>
  <style>
    body {
      margin: 0;
      padding: 20px 0 90px 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 25px 18px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 360px;
      width: 92%;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 6px 0; font-size: 24px; }
    p { font-size: 13px; opacity: 0.9; margin-bottom: 18px; }
    .post-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 18px;
      text-align: left;
    }
    video {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: #000;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .action-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .comments-area {
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 8px;
    }
    .comment-list {
      max-height: 110px;
      overflow-y: auto;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .comment-item {
      background: rgba(255,255,255,0.1);
      padding: 5px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .comment-form {
      display: flex;
      gap: 6px;
    }
    .comment-input {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }
    .send-btn {
      background: white;
      color: #764ba2;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn {
      display: block;
      background: white;
      color: #764ba2;
      text-decoration: none;
      padding: 13px 20px;
      margin: 10px 0;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }
    .plus-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 62px;
      height: 62px;
      background: white;
      color: #764ba2;
      border-radius: 50%;
      font-size: 38px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      cursor: pointer;
      z-index: 1000;
      border: none;
    }
    #status-banner {
      display: none;
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: #fff;
      padding: 14px 20px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 9999;
      width: 85%;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div id="status-banner">⏳ Tayyorlanmoqda...</div>

  <div class="card">
    <img src="IMG_20261110_174641_461.jpg" class="avatar" alt="Tohirjon">
    <h1>Tohirjon Usmonov</h1>
    <p>Mening shaxsiy veb-saytimga xush kelibsiz! Videolarga layk bosing va izoh qoldiring.</p>
    
    <div id="dynamic-videos"></div>

    <a href="https://instagram.com" target="_blank" class="btn">Instagram sahifam</a>
    <a href="https://youtube.com" target="_blank" class="btn">YouTube kanalim</a>
  </div>

  <button type="button" class="plus-btn" onclick="document.getElementById('video-input').click()">+</button>
  <input type="file" id="video-input" accept="video/*" style="display: none;">

  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxY2hmemJhcmRleWx6andqbWpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTYzMTAsImV4cCI6MjExMDAzMjMxMH0.zyfZ0aNZNW2dmxGoDyJkL0KZMQnWLdQc2zPUo_It2vs';
    
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    };

    const banner = document.getElementById('status-banner');
    const plusBtn = document.querySelector('.plus-btn');

    function showStatus(msg, isError = false) {
      banner.style.display = 'block';
      banner.style.background = isError ? '#d9534f' : '#111';
      banner.textContent = msg;
    }

    document.getElementById('video-input').addEventListener('change', async function(e) {
      const file = e.target.files.item(0);
      if (!file) return;

      const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
      plusBtn.textContent = '⏳';
      showStatus(`⏳ Video yuklanmoqda (${sizeMB} MB)...`);

      try {
        const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
        
        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/videos/${fileName}`, {
          method: 'POST',
          headers: {
            ...headers,
            'Content-Type': file.type || 'video/mp4'
          },
          body: file
        });

        if (!uploadRes.ok) {
          const errText = await uploadRes.text();
          showStatus("❌ Yuklash xatosi: " + errText, true);
          plusBtn.textContent = '+';
          return;
        }

        showStatus("⏳ Bazaga saqlanmoqda...");
        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/videos/${fileName}`;
        
        const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/posts`, {
          method: 'POST',
          headers: {
            ...headers,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ video_url: publicUrl, likes: 0 })
        });

        if (!dbRes.ok) {
          const errText = await dbRes.text();
          showStatus("❌ Baza xatosi: " + errText, true);
          plusBtn.textContent = '+';
          return;
        }

        showStatus("✅ Video muvaffaqiyatli chiqarildi!");
        setTimeout(() => { banner.style.display = 'none'; }, 3500);
        plusBtn.textContent = '+';
        e.target.value = '';
        loadVideos();

      } catch (err) {
        showStatus("❌ Xatolik: " + err.message, true);
        plusBtn.textContent = '+';
      }
    });

    async function loadVideos() {
      try {
        const postsRes = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*&order=id.desc`, { headers });
        const posts = await postsRes.json();

        const commentsRes = await fetch(`${SUPABASE_URL}/rest/v1/comments?select=*&order=id.asc`, { headers });
        const allComments = await commentsRes.json();

        const container = document.getElementById('dynamic-videos');
        container.innerHTML = '';

        if (!Array.isArray(posts)) return;

        posts.forEach(post => {
          const postComments = Array.isArray(allComments) ? allComments.filter(c => c.post_id === post.id) : [];
          const commentsHtml = postComments.map(c => `<div class="comment-item">💬 ${c.text}</div>`).join('');

          container.innerHTML += `
            <div class="post-box">
              <video controls playsinline>
                <source src="${post.video_url}" type="video/mp4">
              </video>
              <div class="actions">
                <button class="action-btn" onclick="addLike(${post.id}, ${post.likes || 0})">
                  ❤️ Layk (${post.likes || 0})
                </button>
                <button class="action-btn" onclick="document.getElementById('input-${post.id}').focus()">
                  💬 Komment (${postComments.length})
                </button>
              </div>
              <div class="comments-area">
                <div class="comment-list">${commentsHtml}</div>
                <div class="comment-form">
                  <input type="text" id="input-${post.id}" class="comment-input" placeholder="Izoh yozing...">
                  <button class="send-btn" onclick="addComment(${post.id})">➤</button>
                </div>
              </div>
            </div>
          `;
        });
      } catch (e) {
        showStatus("❌ Yuklashda xato: " + e.message, true);
      }
    }

    async function addLike(postId, currentLikes) {
      await fetch(`${SUPABASE_URL}/rest/v1/posts?id=eq.${postId}`, {
        method: 'PATCH',
        headers: {
          ...headers,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ likes: currentLikes + 1 })
      });
      loadVideos();
    }

    async function addComment(postId) {
      const input = document.getElementById(`input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
        method: 'POST',
        headers: {
          ...headers,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ post_id: postId, text: text })
      });
      loadVideos();
    }

    loadVideos();
  </script>
</body>
</html>
