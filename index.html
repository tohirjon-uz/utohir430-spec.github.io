<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tohirjon | Shaxsiy sahifa</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 350px;
      width: 90%;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    h1 { margin: 0 0 10px 0; font-size: 28px; }
    p { font-size: 15px; opacity: 0.9; margin-bottom: 25px; }
    .btn {
      display: block;
      background: white;
      color: #764ba2;
      text-decoration: none;
      padding: 12px 20px;
      margin: 10px 0;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover { transform: scale(1.03); }
  </style>
</head>
<body>
  <div class="card">
    <img src="IMG_20261110_174641_461.jpg" class="avatar" alt="Tohirjon">
    <h1>Tohirjon</h1>
    <p>Mening shaxsiy veb-saytimga xush kelibsiz! Bu yerda loyihalarim va aloqa ma'lumotlarim joylashgan.</p>
    <a href="https://t.me" class="btn">Telegram orqali yozish</a>
    <a href="https://instagram.com" class="btn">Instagram sahifam</a>
    <a href="tel:+998901234567" class="btn">Qo'ng'iroq qilish</a>
  </div>
</body>
</html>
