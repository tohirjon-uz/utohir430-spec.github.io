<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tohirjon Usmonov</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 20px 16px 90px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    .profile-card {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      margin-bottom: 24px;
    }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: #fff; color: #667eea;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: bold;
      margin: 0 auto 14px; border: 3px solid #fff;
    }
    .profile-card h1 { font-size: 24px; margin-bottom: 8px; }
    .profile-card p { font-size: 14px; opacity: 0.92; line-height: 1.4; margin-bottom: 20px; }
    .social-btn {
      display: block; width: 100%; padding: 14px;
      background: #fff; color: #333; text-decoration: none;
      font-weight: 600; border-radius: 14px; margin-bottom: 10px;
    }
    .video-card {
      background: rgba(255, 255, 255, 0.96); color: #222;
      border-radius: 20px; overflow: hidden; margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    .video-card video { width: 100%; max-height: 420px; background: #000; display: block; }
    .video-info { padding: 14px 16px; }
    .video-title { font-weight: 700; font-size: 16px; margin-bottom: 10px; }
    .actions { display: flex; gap: 12px; margin-bottom: 12px; }
    .action-btn {
      border: none; background: #f0f2f5; padding: 8px 14px;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .comments-box { border-top: 1px solid #eee; padding-top: 10px; }
    .comment-item { font-size: 13px; margin-bottom: 6px; color: #444; }
    .comment-form { display: flex; gap: 8px; margin-top: 8px; }
    .comment-form input {
      flex: 1; padding: 8px 12px; border: 1px solid #ddd;
      border-radius: 10px; outline: none; font-size: 13px;
    }
    .comment-form button {
      background: #667eea; color: #fff; border: none;
      padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
    .fab {
      position: fixed; bottom: 22px; right: 22px;
      width: 60px; height: 60px; border-radius: 50%;
      background: #fff; color: #667eea; border: none;
      font-size: 32px; font-weight: bold;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); cursor: pointer;
    }
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6); align-items: center; justify-content: center; padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff; color: #222; width: 100%; max-width: 400px;
      border-radius: 20px; padding: 20px;
    }
    .modal-content h3 { margin-bottom: 14px; }
    .modal-content input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 10px; }
    .progress-wrap { display: none; margin-bottom: 14px; }
    .progress-bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
    .progress-bar-fill { width: 0%; height: 100%; background: #667eea; transition: width 0.2s; }
    .progress-text { font-size: 13px; color: #444; font-weight: 600; text-align: center; }
    .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-primary { background: #667eea; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; }
    .btn-cancel { background: #eee; color: #333; border: none; padding: 10px 16px; border-radius: 10px; }
    .status-msg { text-align: center; padding: 14px; background: rgba(255,255,255,0.2); border-radius: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="statusBox" class="status-msg" style="display:none;"></div>

    <div class="profile-card">
      <div class="avatar">TU</div>
      <h1>Tohirjon Usmonov</h1>
      <p>Mening shaxsiy veb-saytimga xush kelibsiz! Videolarga layk bosing va izoh qoldiring.</p>
      <a href="https://instagram.com" target="_blank" class="social-btn">Instagram sahifam</a>
      <a href="https://youtube.com" target="_blank" class="social-btn">YouTube kanalim</a>
    </div>

    <div id="videosList"></div>
  </div>

  <button class="fab" onclick="openModal()">+</button>

  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <h3>Yangi video yuklash</h3>
      <input type="text" id="videoTitle" placeholder="Video sarlavhasini yozing..." />
      <input type="file" id="videoFile" accept="video/*" onchange="showFileSize()" />
      
      <div id="progressWrap" class="progress-wrap">
        <div class="progress-bar-bg"><div id="progressFill" class="progress-bar-fill"></div></div>
        <div id="progressText" class="progress-text">0 MB / 0 MB (0%)</div>
      </div>

      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Bekor qilish</button>
        <button class="btn-primary" id="uploadBtn" onclick="uploadVideo()">Yuklash</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ieHAB6n9oBjpZJZ2JVZ6hw_17yR3gK9';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showStatus(text, isError = false) {
      const box = document.getElementById('statusBox');
      box.style.display = 'block';
      box.style.background = isError ? '#e53e3e' : 'rgba(255,255,255,0.25)';
      box.textContent = text;
    }

    function showFileSize() {
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];
      const wrap = document.getElementById('progressWrap');
      const text = document.getElementById('progressText');
      if (file) {
        const totalMB = (file.size / (1024 * 1024)).toFixed(2);
        wrap.style.display = 'block';
        document.getElementById('progressFill').style.width = '0%';
        text.textContent = `Tanlangan fayl: ${totalMB} MB`;
      }
    }

    async function loadVideos() {
      const { data: videos, error } = await db
        .from('videos')
        .select('*, comments(*)')
        .order('created_at', { ascending: false });

      if (error) {
        showStatus('❌ Xato: ' + error.message, true);
        return;
      }

      const list = document.getElementById('videosList');
      if (!videos || videos.length === 0) {
        list.innerHTML = '<div class="status-msg">Hozircha videolar yo‘q. Pastdagi + tugmasi orqali birinchi videoni yuklang!</div>';
        return;
      }

      list.innerHTML = videos.map(v => `
        <div class="video-card">
          <video src="${v.video_url}" controls playsinline></video>
          <div class="video-info">
            <div class="video-title">${v.title}</div>
            <div class="actions">
              <button class="action-btn" onclick="likeVideo('${v.id}', ${v.likes})">❤️ ${v.likes}</button>
              <span class="action-btn">💬 ${(v.comments || []).length}</span>
            </div>
            <div class="comments-box">
              ${(v.comments || []).map(c => `<div class="comment-item"><b>${c.author}:</b> ${c.text}</div>`).join('')}
              <div class="comment-form">
                <input type="text" id="comm-${v.id}" placeholder="Izoh yozing..." />
                <button onclick="addComment('${v.id}')">Yuborish</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function uploadVideo() {
      const title = document.getElementById('videoTitle').value.trim();
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];
      const btn = document.getElementById('uploadBtn');

      if (!title || !file) {
        alert('Iltimos, sarlavha yozing va video tanlang!');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Yuklanmoqda...';

      const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
      const totalMB = (file.size / (1024 * 1024)).toFixed(2);
      const xhr = new XMLHttpRequest();

      xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/videos/${fileName}`, true);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization', `Bearer ${SUPABASE_KEY}`);
      xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');

      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          const loadedMB = (e.loaded / (1024 * 1024)).toFixed(2);
          const percent = Math.round((e.loaded / e.total) * 100);
          document.getElementById('progressFill').style.width = percent + '%';
          document.getElementById('progressText').textContent = `${loadedMB} MB / ${totalMB} MB (${percent}%)`;
        }
      };

      xhr.onload = async function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          const { data: urlData } = db.storage.from('videos').getPublicUrl(fileName);
          const { error: dbError } = await db.from('videos').insert([{ title, video_url: urlData.publicUrl }]);

          btn.disabled = false;
          btn.textContent = 'Yuklash';

          if (dbError) {
            alert('Bazaga saqlashda xato: ' + dbError.message);
          } else {
            closeModal();
