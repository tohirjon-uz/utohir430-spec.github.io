<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tohirjon Usmonov</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #fafafa; color: #262626; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 500px; background: #ffffff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    .top-bar { padding: 15px 20px; border-bottom: 1px solid #dbdbdb; font-weight: 700; font-size: 18px; position: sticky; top: 0; background: #fff; z-index: 10; }
    .profile-header { padding: 20px; }
    .profile-top { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
    .avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid #e1306c; padding: 2px; background: #eee; }
    .stats { display: flex; justify-content: space-around; flex: 1; text-align: center; }
    .stat-num { font-weight: 700; font-size: 17px; display: block; }
    .stat-label { font-size: 13px; color: #8e8e8e; }
    .bio h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .bio p { font-size: 14px; line-height: 1.4; color: #262626; }
    .action-buttons { display: flex; gap: 8px; margin-top: 15px; }
    .btn { flex: 1; padding: 8px; border-radius: 8px; text-align: center; text-decoration: none; font-size: 14px; font-weight: 600; background-color: #efefef; color: #000; }
    .btn-primary { background-color: #0095f6; color: #fff; }
    .gallery-tabs { border-top: 1px solid #dbdbdb; text-align: center; padding: 10px 0; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #262626; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .photo-item { aspect-ratio: 1 / 1; overflow: hidden; cursor: pointer; background: #eee; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; z-index: 100; }
    .modal img { max-width: 95%; max-height: 85%; border-radius: 8px; }
    .close-btn { position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">tohirjon_usmonov</div>

  <div class="profile-header">
    <div class="profile-top">
      <!-- Profil rasmi -->
      <img src="profil.jpg" alt="Tohirjon Usmonov" class="avatar">
      
      <div class="stats">
        <div>
          <span class="stat-num" id="post-count">3</span>
          <span class="stat-label">Postlar</span>
        </div>
        <div>
          <span class="stat-num">1.2K</span>
          <span class="stat-label">Obunachilar</span>
        </div>
        <div>
          <span class="stat-num">350</span>
          <span class="stat-label">Obuna</span>
        </div>
      </div>
    </div>

    <div class="bio">
      <h1>Tohirjon Usmonov</h1>
      <p>Mening shaxsiy veb-saytimga xush kelibsiz!<br>Videolarga layk bosing va izoh qoldiring.</p>
    </div>
<div class="action-buttons">
  <a href="https://instagram.com" target="_blank" class="btn btn-primary">Instagram</a>
  <a href="https://youtube.com" target="_blank" class="btn">YouTube</a>
  <a href="https://t.me" target="_blank" class="btn">Telegram</a>
  <a href="https://tiktok.com" target="_blank" class="btn">TikTok</a>
</div>

  </div>

  <div class="gallery-tabs">POSTLAR</div>

  <!-- Rasmlar galereyasi -->
  <div class="photo-grid" id="gallery">
    <div class="photo-item" onclick="openModal('rasm1.jpg')"><img src="rasm1.jpg" alt="Post 1"></div>
    <div class="photo-item" onclick="openModal('rasm2.jpg')"><img src="rasm2.jpg" alt="Post 2"></div>
    <div class="photo-item" onclick="openModal('rasm3.jpg')"><img src="rasm3.jpg" alt="Post 3"></div>
  </div>
</div>

<!-- Kattalashtirilgan rasm oynasi -->
<div class="modal" id="imageModal" onclick="closeModal()">
  <span class="close-btn">&times;</span>
  <img id="modalImg" src="">
</div>

<script>
  document.getElementById('post-count').innerText = document.querySelectorAll('.photo-item').length;
  function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('imageModal').style.display = 'flex';
  }
  function closeModal() {
    document.getElementById('imageModal').style.display = 'none';
  }
</script>

</body>
</html>
